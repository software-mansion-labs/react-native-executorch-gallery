name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Lint & Typecheck
    if: github.event.pull_request == null || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-gallery
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
  ci-status:
    name: CI Status
    needs: checks
    if: always() && (github.event.pull_request == null || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
