name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event.pull_request == null || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.manual-override.outputs.code || steps.filter.outputs.code }}
      native: ${{ steps.manual-override.outputs.native || steps.filter.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.pull_request.base.ref || 'main' }}
          filters: |
            code:
              - 'src/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'app.json'
              - 'metro.config.js'
              - 'babel.config.js'
              - 'eslint.config.js'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            native:
              - 'src/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - 'app.json'
              - 'metro.config.js'
              - 'babel.config.js'
              - '.nvmrc'
              - '.github/workflows/ci.yml'

      # When running manually via workflow_dispatch, force both filters to true
      - name: Handle workflow_dispatch override
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "native=true" >> "$GITHUB_OUTPUT"
        id: manual-override

  lint-and-typecheck:
    name: Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

  build-ios:
    name: Build iOS App
    needs: changes
    if: needs.changes.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.x
        run: |
          TARGET_XCODE="/Applications/Xcode_16.2.app"
          if [ -d "$TARGET_XCODE" ]; then
            echo "Selecting $TARGET_XCODE"
            sudo xcode-select -s "$TARGET_XCODE"
          else
            echo "::warning::$TARGET_XCODE not found. Searching for available Xcode installations:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "No Xcode installations found in /Applications"
            # Fallback to the latest installed Xcode 16 if available
            LATEST_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LATEST_16" ]; then
              echo "Selecting fallback $LATEST_16"
              sudo xcode-select -s "$LATEST_16"
            else
              echo "::error::No Xcode 16 installation found!"
              exit 1
            fi
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Setup CocoaPods Cache
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS Simulator App
        run: |
          cd ios
          xcodebuild -workspace RNExecuTorchGallery.xcworkspace \
            -scheme RNExecuTorchGallery \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify || xcodebuild -workspace RNExecuTorchGallery.xcworkspace \
            -scheme RNExecuTorchGallery \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

  build-android:
    name: Build Android App
    needs: changes
    if: needs.changes.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

  ci-status:
    name: CI Status
    needs: [changes, lint-and-typecheck, build-ios, build-android]
    if: always() && (github.event.pull_request == null || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          changes="${{ needs.changes.result }}"
          lint="${{ needs.lint-and-typecheck.result }}"
          ios="${{ needs.build-ios.result }}"
          android="${{ needs.build-android.result }}"

          echo "changes: $changes"
          echo "lint-and-typecheck: $lint"
          echo "build-ios: $ios"
          echo "build-android: $android"

          # Fail if any job failed or was cancelled
          for result in "$changes" "$lint" "$ios" "$android"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job failed or was cancelled."
              exit 1
            fi
          done

          echo "All checks passed (or skipped cleanly by paths-filter)."
