name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Tests, Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-gallery
      - run: npm run check
  android:
    name: Android release build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: ./.github/actions/install-gallery
      - uses: gradle/actions/setup-gradle@v4
      - run: npm run native:android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports
          retention-days: 7
  ios:
    name: iOS simulator release build
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      RNET_TARGET: ios
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-gallery
      - run: npm run native:ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            .artifacts/ios-simulator-app.tar.gz
            .artifacts/ios/Logs
          retention-days: 7
  ci-status:
    name: CI Status
    needs: [checks, android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CHECKS: ${{ needs.checks.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: test "$CHECKS" = success && test "$ANDROID" = success && test "$IOS" = success
